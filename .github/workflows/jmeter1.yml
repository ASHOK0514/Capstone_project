name: JMeter performance test

on:
  push:
    branches:
      - main
    paths:
      - 'jmeter_scripts/**'
      - '.github/workflows/jmeter.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'jmeter_scripts/**'
      - '.github/workflows/jmeter.yml'

  workflow_dispatch:
    inputs:
      script:
        description: 'Path to the JMX script'
        default: 'jmeter_scripts/bank1.jmx'
        required: true
        type: string

env:
  JMETER_VERSION: '5.6.3'
  JMX_FILE: ${{ github.event.inputs.script || 'jmeter_scripts/bank1.jmx' }}

jobs:
  jmeter:
    name: Run JMeter Performance Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache JMeter
        id: cache-jmeter
        uses: actions/cache@v4
        with:
          path: apache-jmeter-${{ env.JMETER_VERSION }}
          key: jmeter-${{ env.JMETER_VERSION }}

      - name: Download JMeter
        if: steps.cache-jmeter.outputs.cache-hit != 'true'
        run: |
          curl -fsSL \
            -o jmeter.tgz \
            "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz"

          tar -xzf jmeter.tgz

      - name: Validate JMX file
        run: |
          if [ ! -f "$JMX_FILE" ]; then
            echo "ERROR: JMX file not found: $JMX_FILE"
            exit 1
          fi

          echo "Running JMeter script: $JMX_FILE"

      - name: Run JMeter test
        run: |
          mkdir -p results

          apache-jmeter-${JMETER_VERSION}/bin/jmeter \
            -n \
            -t "$JMX_FILE" \
            -l results/results.jtl \
            -j results/jmeter.log \
            -e \
            -o results/html-report

      - name: Check JMeter results
        run: |
          if [ ! -f results/results.jtl ]; then
            echo "ERROR: JMeter results file was not created."
            exit 1
          fi

          errors=$(awk -F',' 'NR > 1 && $8 == "false" {count++} END {print count+0}' results/results.jtl)
          total=$(awk 'END {print NR-1}' results/results.jtl)

          echo "Samples: $total"
          echo "Errors: $errors"

          {
            echo "### JMeter Performance Test"
            echo ""
            echo "- **JMX:** $JMX_FILE"
            echo "- **Samples:** $total"
            echo "- **Errors:** $errors"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$errors" -gt 0 ]; then
            echo "JMeter test failed because sampler errors were detected."
            exit 1
          fi

      - name: Upload JMeter results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: results/
          if-no-files-found: warn
          retention-days: 7